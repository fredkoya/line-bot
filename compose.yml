services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
      # Keep the image's node_modules rather than the host's, which is
      # installed for macOS.
      - node_modules:/app/node_modules

volumes:
  node_modules:
